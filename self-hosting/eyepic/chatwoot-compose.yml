name: chatwoot

services:
  rails:
    image: eyepic/chatwoot-firebase-profile:${CHATWOOT_VERSION:?set CHATWOOT_VERSION}
    build:
      context: ${CHATWOOT_BUILD_CONTEXT:?set CHATWOOT_BUILD_CONTEXT}
      dockerfile: self-hosting/eyepic/Dockerfile.chatwoot-firebase-profile
    env_file: .env
    volumes:
      - storage-data:/app/storage
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    restart: unless-stopped

  sidekiq:
    image: eyepic/chatwoot-firebase-profile:${CHATWOOT_VERSION:?set CHATWOOT_VERSION}
    build:
      context: ${CHATWOOT_BUILD_CONTEXT:?set CHATWOOT_BUILD_CONTEXT}
      dockerfile: self-hosting/eyepic/Dockerfile.chatwoot-firebase-profile
    env_file: .env
    volumes:
      - storage-data:/app/storage
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: ${POSTGRES_USERNAME:?set POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    env_file: .env
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  firebase-profile:
    profiles: [firebase-profile]
    build:
      context: ${CHATWOOT_BUILD_CONTEXT:?set CHATWOOT_BUILD_CONTEXT}/self-hosting/eyepic/firebase-profile-gateway
    environment:
      FIREBASE_PROFILE_GATEWAY_TOKEN: ${FIREBASE_PROFILE_GATEWAY_TOKEN:?set FIREBASE_PROFILE_GATEWAY_TOKEN}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase_profile_credentials
    secrets:
      - firebase_profile_credentials
    restart: unless-stopped

volumes:
  storage-data:
  postgres-data:
  redis-data:

secrets:
  firebase_profile_credentials:
    file: ${FIREBASE_PROFILE_CREDENTIALS_FILE:?set FIREBASE_PROFILE_CREDENTIALS_FILE}
